<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Files Hub</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      text-align: center;
      padding: 50px;
      color: white;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn {
      text-decoration: none;
      background: white;
      color: #0077cc;
      padding: 15px 25px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .btn:hover {
      background: #0077cc;
      color: white;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <h1>Welcome to Random Files Hub</h1>
  <p>Click the buttons below to open files A, B, and C.</p>

  <div class="btn-container">
    <a class="btn" href="a.txt" target="_blank">Open File A</a>
    <a class="btn" href="b.txt" target="_blank">Open File B</a>
    <a class="btn" href="c.txt" target="_blank">Open File C</a>
  </div>

</body>
</html>
